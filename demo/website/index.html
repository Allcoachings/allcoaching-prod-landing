<style>
:root{
  --ui:'Inter Tight',-apple-system,system-ui,sans-serif;
  --display:'Instrument Serif','Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --bg:#F7FAFB;--bg-tint:#EFF5F7;--surface:#FFFFFF;--surface-2:#F1F6F8;--surface-3:#E7EFF3;
  --ink-1:#0F1720;--ink-2:#46545F;--ink-3:#7A8894;--ink-4:#A8B4BE;
  --line:rgba(15,23,32,.08);--line-2:rgba(15,23,32,.13);--line-strong:rgba(15,23,32,.22);
  --accent:#F0561D;--accent-deep:#C63E0C;--accent-soft:#FFF0E9;--accent-line:#FFD3BE;
  --accent-grad:linear-gradient(135deg,#FF7A45 0%,#F0561D 55%,#C63E0C 100%);
  --cyan:#0EA5BE;--cyan-deep:#0B7E92;--cyan-soft:#E4F7FA;--cyan-line:#B7E7EF;
  --positive:#12855A;--positive-soft:#DCF3E8;--negative:#C93B2B;--negative-soft:#FBE3DF;
  --info:#2F6BB5;--info-soft:#DFEAF7;--violet:#6A4CA8;--violet-soft:#EAE3F7;--warning:#B07A11;--warning-soft:#F8EBD2;
  --sh-1:0 1px 2px rgba(12,32,45,.05);--sh-2:0 6px 18px -6px rgba(12,32,45,.12),0 2px 4px -2px rgba(12,32,45,.06);
  --sh-3:0 24px 48px -16px rgba(12,32,45,.20),0 8px 18px -6px rgba(12,32,45,.10);
  --ring:0 0 0 3px rgba(240,86,29,.20);--top:64px;--side:250px;--ease:cubic-bezier(.22,.85,.25,1);
  --hex:rgba(14,165,190,.055);
}
html[data-theme="dark"]{
  --bg:#0A1218;--bg-tint:#0D1720;--surface:#111C24;--surface-2:#17242E;--surface-3:#1E2E39;
  --ink-1:#EAF3F7;--ink-2:rgba(234,243,247,.76);--ink-3:rgba(234,243,247,.5);--ink-4:rgba(234,243,247,.3);
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);--line-strong:rgba(255,255,255,.24);
  --accent:#FF6B33;--accent-deep:#FF8B5E;--accent-soft:rgba(240,86,29,.16);--accent-line:rgba(240,86,29,.36);
  --cyan:#38C6DC;--cyan-deep:#6FDBEC;--cyan-soft:rgba(14,165,190,.16);--cyan-line:rgba(14,165,190,.36);
  --positive:#3FBF88;--positive-soft:rgba(18,133,90,.22);--negative:#F0705C;--negative-soft:rgba(201,59,43,.22);
  --info:#7BA7E0;--info-soft:rgba(47,107,181,.22);--violet:#A98CE0;--violet-soft:rgba(106,76,168,.22);
  --warning:#DFB35A;--warning-soft:rgba(176,122,17,.22);
  --sh-1:none;--sh-2:0 6px 18px -6px rgba(0,0,0,.5);--sh-3:0 24px 48px -16px rgba(0,0,0,.7);
  --hex:rgba(56,198,220,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ui);background:var(--bg);color:var(--ink-1);
 background-image:linear-gradient(var(--hex) 1px,transparent 1px),linear-gradient(90deg,var(--hex) 1px,transparent 1px);
 background-size:46px 46px,46px 46px;background-attachment:fixed;font-size:14px;line-height:1.45;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;display:inline-flex;align-items:center}
input{font-family:inherit;color:inherit}
img,svg{display:block;max-width:100%}
svg{flex-shrink:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ital{font-family:var(--display);font-style:italic;font-weight:400}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.hide{display:none!important}
.protected{user-select:none;-webkit-user-select:none}

/* Top bar */
.top{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:100;display:flex;align-items:center;gap:16px;padding:0 20px;

.qmarks .n{background:rgba(224,58,58,.1);color:#C63030}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:16px;overflow-y:auto;flex:1;align-content:start}

.pnum.skip{background:rgba(224,58,58,.1);border-color:rgba(224,58,58,.3);color:#C63030}
.pnum.cur{outline:2px solid var(--accent);outline-offset:2px}
.legend{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.legend div{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2)}
.legend i{width:13px;height:13px;border-radius:4px;flex-shrink:0}
.xfoot{display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface);flex-shrink:0}
.ring{--p:0;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-3) 0)}
.ring>div{width:92px;height:92px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}

/*═══════ DRIVE-STYLE PDF ═══════*/
.drive{position:fixed;inset:0;z-index:400;background:#2E2A26;display:flex;flex-direction:column;color:#EDE7DE}
.drive .dtop{display:flex;align-items:center;gap:14px;padding:0 16px;height:54px;flex-shrink:0;

  width:34px;height:34px;border-radius:8px;transition:.15s}

.dsep{width:1px;height:22px;background:rgba(255,255,255,.14)}
.drive .dmain{flex:1;display:flex;overflow:hidden}
.drail{width:172px;flex-shrink:0;overflow-y:auto;padding:14px 10px;background:rgba(22,19,16,.55);
  border-right:1px solid rgba(255,255,255,.07)}
.thmb{border-radius:5px;overflow:hidden;margin-bottom:14px;cursor:pointer;border:2px solid transparent;
  background:#fff;aspect-ratio:1/1.414;position:relative;transition:.15s}

.thmb .lbl{position:absolute;bottom:0;left:0;right:0;font-family:var(--mono);font-size:9.5px;text-align:center;
  background:rgba(22,19,16,.8);color:#EDE7DE;padding:2px}

.dview{flex:1;overflow:auto;padding:30px;display:flex;flex-direction:column;align-items:center;gap:26px}
.sheet{width:794px;min-height:1123px;background:#fff;color:#1A1712;border-radius:3px;
  box-shadow:0 8px 32px rgba(0,0,0,.42);padding:74px 78px;position:relative;transform-origin:top center}
.sheet h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:30px;margin-bottom:20px;color:#15110D}
.sheet p{font-size:15px;line-height:1.85;color:#2C2721}
.sheet .hint{margin-top:26px;padding:16px 20px;border-left:3px solid #F0561D;background:#FFF6F1;
  font-size:13.5px;line-height:1.7;color:#4A4038}
.sheet .pfoot{position:absolute;left:78px;right:78px;bottom:40px;display:flex;justify-content:space-between;

  border-top:1px solid #E8E2D8;padding-top:12px}

  font-family:var(--mono);font-size:52px;font-weight:700;color:rgba(240,86,29,.07);
  transform:rotate(-28deg);letter-spacing:6px;user-select:none}

/*═══════════════════════════════════════════════
  ChemPsi — chemistry theme layer
  mentor profile · footer · contact · WhatsApp
═══════════════════════════════════════════════*/

/*── molecular accents ──*/
.eyebrow::before,.sec .eyebrow::before{background:var(--accent)!important}
.hexdot{width:9px;height:9px;background:var(--cyan);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:inline-block}

/*── sidebar mentor card ──*/
.mentorcard{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;margin:2px 0 6px;border-radius:12px;
 background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:.18s var(--ease);text-align:left}
.mentorcard:hover{border-color:var(--accent-line);box-shadow:var(--sh-2);transform:translateY(-1px)}
.mentorcard.on{background:var(--accent-soft);border-color:var(--accent-line)}
.mentorcard img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top center;flex-shrink:0}
.mentorcard span{display:flex;flex-direction:column;min-width:0}
.mentorcard b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mentorcard i{font-style:normal;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snav.wa{color:#12855A}
.snav.wa:hover{background:rgba(18,133,90,.09)}

/*── mentor strip (home / explore) ──*/
.mstrip{display:flex;align-items:center;gap:24px;padding:22px;border-radius:20px;cursor:pointer;
 background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);transition:.22s var(--ease);position:relative;overflow:hidden}
.mstrip::after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;
 background:radial-gradient(circle,var(--cyan-soft),transparent 65%);pointer-events:none}
.mstrip:hover{border-color:var(--accent-line);box-shadow:var(--sh-3);transform:translateY(-2px)}
.mstrip>img{width:132px;height:150px;border-radius:16px;object-fit:cover;object-position:top center;flex-shrink:0}
.mstrip .mtx{flex:1;min-width:0;position:relative}
.mstrip .lbl{font-size:9.5px;letter-spacing:1.5px;color:var(--accent-deep);font-weight:700}
.mstrip h3{font-size:29px;margin:6px 0 2px;letter-spacing:-.01em}
.mstrip .sb{font-size:13px;color:var(--ink-3)}
.mstrip p{font-size:14.5px;color:var(--ink-2);margin-top:10px;line-height:1.6}
.mchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.mgo{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);
 display:grid;place-items:center;flex-shrink:0;transition:.22s var(--ease)}
.mstrip:hover .mgo{background:var(--accent);color:#fff;transform:translateX(3px)}

/*── mentor hero ──*/
.mentorhero{position:relative;display:flex;align-items:flex-end;gap:28px;padding:30px 32px;border-radius:22px;overflow:hidden;
 background:linear-gradient(135deg,#0E1B22 0%,#132732 55%,#1C3A45 100%);color:#EAF3F7;min-height:250px}
.mh-art{position:absolute;inset:0;pointer-events:none;opacity:.5;
 background-image:radial-gradient(circle at 82% 18%,rgba(240,86,29,.36),transparent 48%),
   radial-gradient(circle at 96% 76%,rgba(14,165,190,.34),transparent 46%),
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='104' viewBox='0 0 120 104'><g fill='none' stroke='rgba(255,255,255,0.14)' stroke-width='1'><polygon points='30,2 58,18 58,50 30,66 2,50 2,18'/><polygon points='90,2 118,18 118,50 90,66 62,50 62,18'/><polygon points='60,54 88,70 88,102 60,118 32,102 32,70'/></g></svg>");
 background-repeat:no-repeat,no-repeat,repeat}
.mh-photo{width:170px;height:200px;border-radius:18px;object-fit:cover;object-position:top center;flex-shrink:0;
 position:relative;border:1px solid rgba(255,255,255,.18);box-shadow:0 22px 44px -18px rgba(0,0,0,.7)}
.mh-body{position:relative;flex:1;min-width:0;padding-bottom:6px}
.mh-body h1{font-size:clamp(30px,4vw,46px);margin:12px 0 4px;color:#fff;line-height:1.08}
.mh-sub{font-family:var(--mono);font-size:11.5px;letter-spacing:1.2px;color:#9DB4BF;text-transform:uppercase}
.mh-quote{font-family:var(--display);font-style:italic;font-size:19px;color:#CFE0E7;margin-top:12px}
.mh-cta{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.mh-cta .btn-ghost{background:rgba(255,255,255,.07);color:#EAF3F7;border-color:rgba(255,255,255,.2)}
.mh-cta .btn-ghost:hover{background:rgba(255,255,255,.14)}
.mentorhero .pill.live{background:rgba(240,86,29,.18);border:1px solid rgba(240,86,29,.4);color:#FFC9AC;
 display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:100px;font-family:var(--mono);
 font-size:9.5px;font-weight:700;letter-spacing:1.3px}

/*── about grid ──*/
.aboutg{display:grid;grid-template-columns:1fr 322px;gap:22px;align-items:start}
.aboutg .sticky{position:sticky;top:calc(var(--top) + 18px)}
.credrow{display:grid;grid-template-columns:30px 108px 1fr;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.credrow:last-child{border-bottom:none}
.credrow .ci{color:var(--accent-deep);display:flex}
.credrow .ck{font-family:var(--mono);font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.credrow .cv{font-size:14px;color:var(--ink-1);line-height:1.55}
.methodc{position:relative;overflow:hidden}
.methodc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.methodc .mnum{font-size:10px;letter-spacing:1.4px;color:var(--accent-deep);font-weight:700}
.methodc h4{font-size:16px;font-weight:600;margin:9px 0 7px;letter-spacing:-.01em}

.teachrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.4px;color:var(--ink-2)}
.teachrow svg{color:var(--cyan-deep)}

/*── contact ──*/
.contactg{display:grid;grid-template-columns:1fr 420px;gap:22px;align-items:start}
.crow{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;
 margin-bottom:9px;background:var(--surface);transition:.18s var(--ease);text-decoration:none}
.crow:hover{border-color:var(--accent-line);box-shadow:var(--sh-2);transform:translateY(-1px)}
.crow .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
 background:var(--accent-soft);color:var(--accent-deep)}
.crow .ic.wa{background:rgba(37,211,102,.13);color:#12855A}
.crow .k{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-3)}
.crow .v{display:block;font-size:14.5px;font-weight:600;margin-top:2px}
.enqform{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--sh-2);
 position:sticky;top:calc(var(--top) + 18px)}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.f{margin-bottom:13px}
.f label{display:block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
 color:var(--ink-3);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line-2);border-radius:11px;padding:11px 13px;
 font-family:var(--ui);font-size:14px;color:var(--ink-1);background:var(--surface);outline:none;transition:.16s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:var(--ring)}
.f textarea{resize:vertical;min-height:88px}
.f .err{color:var(--negative);font-size:11.5px;font-weight:600;margin-top:5px;display:none}
.f.bad input,.f.bad select{border-color:var(--negative)}
.f.bad .err{display:block}
.okbox{display:flex;gap:10px;background:var(--positive-soft);border:1px solid rgba(18,133,90,.25);color:var(--positive);
 border-radius:13px;padding:14px 16px;font-size:13.5px;line-height:1.6;margin-bottom:14px}
.okbox a{color:var(--positive);text-decoration:underline}

/*── footer ──*/
.foot{margin-top:56px;padding-top:34px;border-top:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:1.7fr 1fr 1.3fr 1.2fr;gap:34px}

.fsoc a{font-family:var(--mono);font-size:10px;letter-spacing:.8px;padding:6px 11px;border-radius:8px;
 border:1px solid var(--line-2);color:var(--ink-2);transition:.16s}
.fsoc a:hover{border-color:var(--accent);color:var(--accent-deep)}
.foot h4{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-3);
 margin-bottom:13px;font-weight:700}
.foot ul{list-style:none}
.foot li{font-size:13.4px;color:var(--ink-2);padding:5px 0;cursor:pointer;transition:.15s}
.foot li:hover{color:var(--accent-deep)}
.foot li.acc{color:var(--accent-deep);font-weight:600}
.frow{display:flex;align-items:center;gap:9px;font-size:13.4px;color:var(--ink-2);padding:6px 0;text-decoration:none;transition:.15s}
.frow:hover{color:var(--accent-deep)}
.frow svg{color:var(--ink-3);flex-shrink:0}
.frow:hover svg{color:var(--accent)}
.fbot{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:28px;padding:18px 0 6px;
 border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.fbot .tg{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase}

/*── WhatsApp FAB ──*/
.wafab{position:fixed;right:22px;bottom:22px;z-index:95;width:54px;height:54px;border-radius:50%;background:#25D366;
 display:grid;place-items:center;color:#fff;box-shadow:0 12px 30px -10px rgba(37,211,102,.7);transition:.2s var(--ease)}
.wafab:hover{transform:scale(1.08) translateY(-2px)}
.wafab::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid #25D366;animation:wapulse 2.6s infinite}
@keyframes wapulse{0%{transform:scale(1);opacity:.65}70%{transform:scale(1.55);opacity:0}100%{opacity:0}}

.crow,.frow,.fsoc a,.okbox a{-webkit-tap-highlight-color:transparent}

/*═══════════════════════════════════════════════
  ChemPsi — native-app shell
  bottom tabs · safe areas · touch feedback
  animated live hero · pixel-perfect player
═══════════════════════════════════════════════*/

/*── app-like base ──*/
html{-webkit-text-size-adjust:100%}
html{overscroll-behavior-y:none}
body{-webkit-tap-highlight-color:transparent}
button,a,.card,.ccard,.snav,.chip,.tab,.crow,.opt,.pnum{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.main,.side,#chat,.dview,.pal,.tabs,.chips,.rail,.tblw{-webkit-overflow-scrolling:touch}
@media(hover:none){
  .card:hover,.ccard:hover,.crow:hover,.mstrip:hover,.feat:hover{transform:none;box-shadow:var(--sh-1)}
  .card:active,.ccard:active,.crow:active,.mstrip:active{transform:scale(.985);transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .snav:active,.chip:active,.tab:active{opacity:.7}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/*── safe areas ──*/
.top{padding-top:env(safe-area-inset-top);height:calc(var(--top) + env(safe-area-inset-top))}
.side{top:calc(var(--top) + env(safe-area-inset-top));padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.main{margin-top:calc(var(--top) + env(safe-area-inset-top))}
.wafab{bottom:calc(22px + env(safe-area-inset-bottom))}

/*── bottom tab bar (mobile only) ──*/
.tabbar{display:none}
@media(max-width:900px){
 .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:99;display:flex;align-items:stretch;
   background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(18px) saturate(1.4);
   border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 24px -12px rgba(12,32,45,.22)}
 .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
   padding:9px 2px 8px;color:var(--ink-3);font-size:10px;font-weight:600;letter-spacing:.1px;position:relative;
   background:none;border:none;min-height:56px;transition:color .18s var(--ease)}
 .tabbar button .tbi{display:flex;transition:transform .22s var(--ease)}
 .tabbar button.on{color:var(--accent-deep)}
 .tabbar button.on .tbi{transform:translateY(-2px)}
 .tabbar button.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
   width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}
 .tabbar button:active{opacity:.6}
 .main{padding-bottom:calc(84px + env(safe-area-inset-bottom))!important}
 .wafab{bottom:calc(78px + env(safe-area-inset-bottom))}
 .exam,.drive{padding-bottom:env(safe-area-inset-bottom)}
}

/*── install banner ──*/
.installbar{display:none;align-items:center;gap:12px;padding:12px 14px;margin:0 0 16px;border-radius:16px;
 background:var(--surface);border:1px solid var(--accent-line);box-shadow:var(--sh-2)}
.installbar.show{display:flex}
.installbar img{width:42px;height:42px;border-radius:11px;flex-shrink:0}
.installbar .ib{flex:1;min-width:0}
.installbar b{display:block;font-size:14px;font-weight:600}
.installbar span{display:block;font-size:12.2px;color:var(--ink-3);margin-top:1px}
.installbar .x{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);flex-shrink:0}

/*── iOS install sheet ──*/
.sheetwrap{position:fixed;inset:0;z-index:210;background:rgba(10,18,24,.5);backdrop-filter:blur(3px);
 display:none;align-items:flex-end;justify-content:center}
.sheetwrap.on{display:flex;animation:fadein .2s}
.sheetcard{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom));
 animation:slideup .28s var(--ease);box-shadow:0 -20px 60px -20px rgba(0,0,0,.4)}
.sheetcard .grab{width:38px;height:4px;border-radius:3px;background:var(--line-2);margin:0 auto 16px}
.sheetcard ol{margin:14px 0 0 18px;font-size:14px;color:var(--ink-2);line-height:1.9}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes slideup{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}

/*═══════ LIVE HERO — chemistry animation ═══════*/
.livehero{position:relative;isolation:isolate}
.lh-lab{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.lh-lab .flask{position:absolute;right:34px;bottom:-6px;width:132px;height:150px;opacity:.9}
.lh-lab .bub{position:absolute;bottom:34px;border-radius:50%;background:rgba(255,255,255,.55);
 animation:bubrise linear infinite}
@keyframes bubrise{0%{transform:translateY(0) scale(.6);opacity:0}
 12%{opacity:.85}70%{opacity:.7}100%{transform:translateY(-72px) scale(1.25);opacity:0}}
.lh-lab .mol{position:absolute;animation:molfloat linear infinite}
@keyframes molfloat{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(10px,-14px) rotate(180deg)}
 100%{transform:translate(0,0) rotate(360deg)}}
.lh-lab .orbit{position:absolute;left:-40px;top:-52px;width:230px;height:230px;opacity:.55;
 animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lh-lab .beam{position:absolute;inset:0;background:
 radial-gradient(420px 200px at 84% 26%,rgba(240,86,29,.28),transparent 70%),
 radial-gradient(360px 190px at 12% 92%,rgba(14,165,190,.26),transparent 70%);
 animation:beam 7s ease-in-out infinite alternate}
@keyframes beam{from{opacity:.55}to{opacity:1}}
.livehero>*:not(.lh-lab){position:relative;z-index:1}
.lvdot{width:8px;height:8px;border-radius:50%;background:#FF6B33;box-shadow:0 0 0 0 rgba(255,107,51,.65);
 animation:lvpulse 1.9s infinite}
@keyframes lvpulse{70%{box-shadow:0 0 0 11px rgba(255,107,51,0)}100%{box-shadow:0 0 0 0 rgba(255,107,51,0)}}
.eqbars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.eqbars i{width:2.5px;background:#FF9F70;border-radius:2px;animation:eq .9s ease-in-out infinite}
.eqbars i:nth-child(2){animation-delay:.15s}.eqbars i:nth-child(3){animation-delay:.3s}
.eqbars i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}

/*═══════ PLAYER — pixel perfect ═══════*/
.player{border-radius:16px;background:#080F14;isolation:isolate}
.player.fs{position:fixed;inset:0;z-index:300;border-radius:0;aspect-ratio:auto;height:100dvh;width:100vw}
.pshade{position:absolute;inset:0;z-index:2;pointer-events:none;
 background:linear-gradient(to top,rgba(4,10,14,.82) 0,rgba(4,10,14,.28) 22%,transparent 46%),
            linear-gradient(to bottom,rgba(4,10,14,.55) 0,transparent 26%)}
.ptop{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:flex-start;gap:9px;
 padding:14px 16px;opacity:0;transform:translateY(-6px);transition:.22s var(--ease)}
.player:hover .ptop,.player.idle .ptop,.player.touched .ptop{opacity:1;transform:none}
.ptop .ptitle{font-size:13.5px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);
 margin-left:auto;text-align:right;max-width:52%;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seekzone{position:absolute;top:0;bottom:64px;width:32%;z-index:3}
.seekzone.l{left:0}.seekzone.r{right:0}
.seekflash{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:88px;height:88px;border-radius:50%;
 background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:11px;
 font-weight:700;opacity:0;pointer-events:none}
.seekflash.go{animation:flash .55s var(--ease)}
@keyframes flash{0%{opacity:0;transform:translateY(-50%) scale(.7)}30%{opacity:1;transform:translateY(-50%) scale(1)}
 100%{opacity:0;transform:translateY(-50%) scale(1.15)}}
.bigplay{width:78px;height:78px;box-shadow:0 12px 34px -10px rgba(0,0,0,.7)}
.bigplay::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
 animation:ring 3s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.pctrl{padding:0 14px 12px;z-index:6}
.pbar{height:3.5px;border-radius:3px;background:rgba(255,255,255,.24);position:relative;cursor:pointer;
 margin-bottom:9px;transition:height .16s}
.pbar:hover,.player.scrub .pbar{height:6px}
.pbar .buf{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.3);border-radius:3px}
.pbar i{position:relative;z-index:2}
.pbar i::after{width:12px;height:12px;right:-6px;opacity:0;transition:opacity .16s;box-shadow:0 1px 5px rgba(0,0,0,.6)}
.pbar:hover i::after,.player.scrub i::after{opacity:1}
.prow{gap:15px;padding-bottom:2px}
.prow button{opacity:.94;transition:transform .14s var(--ease),opacity .14s}
.prow button:hover{opacity:1;transform:scale(1.12)}
.prow button:active{transform:scale(.94)}
.prow .t{font-size:11.5px;letter-spacing:.2px;white-space:nowrap}
.pcta{position:absolute;right:14px;bottom:60px;z-index:7;display:flex;align-items:center;gap:9px;
 background:rgba(9,17,22,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);
 border-radius:14px;padding:9px 10px 9px 12px;color:#fff;opacity:0;transform:translateY(6px);
 transition:.24s var(--ease);max-width:min(330px,72%)}
.player:hover .pcta,.player.idle .pcta,.player.touched .pcta{opacity:1;transform:none}
.pcta .pk{font-family:var(--mono);font-size:8.5px;letter-spacing:1.3px;color:#FFC9AC;font-weight:700}
.pcta .pt{font-size:12.5px;font-weight:600;line-height:1.3;margin-top:2px}
.pcta .btn{padding:7px 13px;font-size:12.5px;flex-shrink:0}
.endcard{position:absolute;inset:0;z-index:8;display:none;place-items:center;text-align:center;padding:22px;
 background:rgba(6,12,16,.86);backdrop-filter:blur(6px)}
.endcard.on{display:grid}
.endcard h3{font-family:var(--display);font-style:italic;font-size:27px;color:#fff}
.endcard p{font-size:13.5px;color:#B6C6CE;margin:7px 0 16px;max-width:340px}
.endcard .row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
@media(max-width:640px){
 .prow{gap:11px}
 .prow .t{font-size:10.5px}
 .prow .speed{padding:1px 6px;font-size:10px}
 .bigplay{width:62px;height:62px}
 .pcta{right:10px;left:10px;bottom:54px;max-width:none}
 .ptop .ptitle{display:none}
 .pctrl{padding:0 10px 9px}
}

function fbar(kind){
  const F=S.filters;
  const mk=(label,key,vals)=>`<span class="lbl">${label}</span>`+vals.map(v=>
    `<button class="fchip${F[key]===v?' on':''}" onclick="setF('${key}','${v}')">${v}</button>`).join('');
  let html=`<div class="fbar">${I('filter',16)}${mk('Subject','sub',SUBJECTS)}`;
  if(kind!=='pdf')html+=`<div class="fsep"></div>${mk('Price','price',['All','Free','Paid'])}`;
  if(kind==='test')html+=`<div class="fsep"></div>${mk('Level','diff',['All','Easy','Medium','Hard'])}`;
  if(kind==='course')html+=`<div class="fsep"></div>${mk('Sort','sort',['Popular','Rating','Price ↑','Price ↓'])}`;
  html+=`<div style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)" id="fcount"></div></div>`;
  return html;
}
function setF(k,v){S.filters[k]=v;render();}
function applyC(list){
  const F=S.filters;let r=list.filter(c=>(F.sub==='All'||c.tag===F.sub)&&(F.price==='All'||(F.price==='Free'?c.price===0:c.price>0)));
  if(F.sort==='Rating')r=[...r].sort((a,b)=>b.rating-a.rating);
  if(F.sort==='Price ↑')r=[...r].sort((a,b)=>a.price-b.price);
  if(F.sort==='Price ↓')r=[...r].sort((a,b)=>b.price-a.price);
  return r;
}
const applyT=l=>l.filter(t=>(S.filters.sub==='All'||t.cat===S.filters.sub)&&(S.filters.price==='All'||(S.filters.price==='Free'?t.price==='Free':t.price!=='Free'))&&(S.filters.diff==='All'||t.difficulty===S.filters.diff));

function setCat(c){S.cat=c;const m={'Live':'live','Courses':'courses','Test series':'tests','Notes & PDFs':'pdfs','Community':'community','Faculty':'educator'};
  if(c==='Faculty')return go('educator','e1');
  if(m[c])go(m[c]);else go('home');}

function toggleFollow(id){S.follows[id]=!S.follows[id];toast(S.follows[id]?'Following '+ED(id).name:'Unfollowed '+ED(id).name);render();}
function toggleLike(id){S.likes[id]=!S.likes[id];render();}
function toggleSave(id){S.saved[id]=!S.saved[id];toast(S.saved[id]?'Saved':'Removed from saved');render();}
function toggleRemind(i){S.reminders[i]=!S.reminders[i];toast(S.reminders[i]?'We will remind you':'Reminder removed');render();}
function vote(pid,oid){if(S.polls[pid])return;S.polls[pid]=oid;toast('Vote counted');render();}

function addComment(vid){const el=document.getElementById('cmtInput');const t=el.value.trim();if(!t)return;
  S.comments[vid]=[t,...(S.comments[vid]||[])];render();toast('Comment posted');}
function toast(m){const t=document.createElement('div');t.className='toast';t.innerHTML=`<span style="color:var(--accent);display:flex">${I('check',16)}</span>${m}`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2400);}
function openNotifs(){
  const items=[['signal','Anupam sir is live now','Chemical Bonding — 1,842 watching','2m'],
    ['pencil','New test added','Mole Concept — chapter test','1h'],
    ['mortar','New batch open','Class 11 NEET Chemistry Programme','3h'],
    ['heart','Your comment got 24 likes','on “Aldol Condensation — every variant”','5h'],
    ['download','Notes downloaded','Physical Chemistry formula sheet is in your library','1d']];
  document.getElementById('scrim').innerHTML=`<div class="modal" onclick="event.stopPropagation()">
    <div class="chead"><h3>Notifications</h3><button class="iconbtn" style="margin-left:auto" onclick="closeModal()">${I('close',18)}</button></div>
    ${items.map(([ic,t,s,a])=>`<div style="display:flex;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line)">
      <div style="width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;flex-shrink:0">${I(ic,17)}</div>
      <div style="flex:1"><div style="font-weight:600;font-size:13.5px">${t}</div>
        <div style="font-size:12.5px;color:var(--ink-3);margin-top:2px">${s}</div></div>
      <div class="mono" style="font-size:11px;color:var(--ink-4)">${a}</div></div>`).join('')}
    <div style="padding:14px 18px"><button class="btn btn-ghost" style="width:100%;justify-content:center" onclick="closeModal()">Close</button></div></div>`;
  document.getElementById('scrim').classList.add('on');
}
function closeModal(){const s=document.getElementById('scrim');s.classList.remove('on');s.innerHTML='';}

const qEl=document.getElementById('q'),sgEl=document.getElementById('sugg');
qEl.addEventListener('input',()=>{const v=qEl.value.trim();if(!v){sgEl.classList.add('hide');return;}
  const eds=EDUCATORS.filter(e=>e.name.toLowerCase().includes(v.toLowerCase())).slice(0,3);
  const cs=[...COURSES,...VIDEOS,...TESTS].filter(c=>c.title.toLowerCase().includes(v.toLowerCase())).slice(0,4);
  sgEl.innerHTML=`${eds.length?'<div class="h">Educators</div>'+eds.map(e=>`<div class="it" onclick="qEl.value='';sgEl.classList.add('hide');go('educator','${e.id}')">${av(e,26)}<span>${e.name}</span><span style="margin-left:auto;font-size:11.5px;color:var(--ink-3)">${e.subject}</span></div>`).join(''):''}
    ${cs.length?'<div class="h">Content</div>'+cs.map(c=>`<div class="it" onclick="doSearch('${c.title.replace(/'/g,'')}')">${I('search',16)}<span>${c.title}</span></div>`).join(''):''}
    <div class="h">Trending</div>${TRENDING.slice(0,3).map(([t,d])=>`<div class="it" onclick="doSearch('${t}')"><span style="color:var(--accent);display:flex">${I('trend',16)}</span><span>${t}</span><span class="d">${d}</span></div>`).join('')}`;
  sgEl.classList.remove('hide');});
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&qEl.value.trim())doSearch(qEl.value.trim());});
qEl.addEventListener('focus',()=>{if(!qEl.value){
  sgEl.innerHTML=`<div class="h">Trending at ChemPsi</div>${TRENDING.map(([t,d])=>`<div class="it" onclick="doSearch('${t}')"><span style="color:var(--accent);display:flex">${I('trend',16)}</span><span>${t}</span><span class="d">${d}</span></div>`).join('')}`;
  sgEl.classList.remove('hide');}});
document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))sgEl.classList.add('hide');});
function doSearch(q){if(!q)return;S.q=q;qEl.value=q;sgEl.classList.add('hide');go('search');}

function bad(id,on){document.getElementById(id).classList.toggle('bad',on);return !on;}
function sendEnq(ev){
  ev.preventDefault();
  const g=id=>document.getElementById(id).value.trim();
  const name=g('i-name'),phone=g('i-phone').replace(/\D/g,''),email=g('i-email'),course=g('i-course'),msg=g('i-msg');
  let ok=true;
  ok=bad('f-name',name.length<2)&&ok;
  ok=bad('f-phone',!(phone.length===10||(phone.length===12&&phone.startsWith('91'))))&&ok;
  ok=bad('f-email',!!email&&!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email))&&ok;
  ok=bad('f-course',!course)&&ok;
  if(!ok){toast('Please check the highlighted fields');return false;}
  try{const a=JSON.parse(localStorage.getItem('chempsi_leads')||'[]');
    a.push({name,phone,email,course,message:msg,at:new Date().toISOString()});
    localStorage.setItem('chempsi_leads',JSON.stringify(a));}catch(e){}
  const text='New enquiry — ChemPsi\n\nName: '+name+'\nPhone: '+phone+'\n'+(email?'Email: '+email+'\n':'')+'Programme: '+course+'\n'+(msg?'Message: '+msg+'\n':'');
  window.open(WA(text),'_blank','noopener');
  document.getElementById('okbox').innerHTML=`<div class="okbox">${I('check',17)}
    <span>Thank you, ${name.split(' ')[0]}. Your enquiry is ready in WhatsApp — press send there and we will reply shortly.<br/>
    <a href="${WA(text)}" target="_blank" rel="noopener">Open WhatsApp again</a> ·
    <a href="mailto:${BRAND.email}?subject=${encodeURIComponent('Enquiry — '+course)}&body=${encodeURIComponent(text)}">Send by email instead</a></span></div>`;
  document.getElementById('enq').reset();
  toast('Enquiry prepared in WhatsApp');
  document.getElementById('okbox').scrollIntoView({behavior:'smooth',block:'center'});
  return false;
}

<script>
/*═══════ WATCH — premium protected player ═══════*/
V.watch=()=>{
  const v=VIDEOS.find(x=>x.id===S.param); if(!v)return V.home();
  const e=ED(v.educatorId), cm=S.comments[v.id]||[];
  return `<button class="back" onclick="history.back()">${I('back',16)} Back</button>
  <div style="display:grid;grid-template-columns:1fr 376px;gap:26px;align-items:start">
   <div>
    <div class="player protected${S.watch.playing?'':' idle'}" id="player" style="background:${grad(v.pal)}"
         onclick="touchReveal()">
      <div class="stage"></div>
      <div class="pshade"></div>
      <div class="wmark" id="wm" style="left:6%;top:14%">${ME.handle} · CHEMPSI</div>

      <div class="ptop">
        <span class="ppill">${I('lock',11)} DRM PROTECTED</span>
        <span class="ppill">${I('hd',11)} 1080p</span>
        <span class="ptitle">${v.title}</span>
      </div>

      <div class="seekzone l" ondblclick="dblSeek('l')"></div>
      <div class="seekzone r" ondblclick="dblSeek('r')"></div>
      <div class="seekflash" id="sf-l" style="left:9%"></div>
      <div class="seekflash" id="sf-r" style="right:9%"></div>

      <button class="bigplay" id="bigplay" onclick="event.stopPropagation();togglePlay()"
              aria-label="Play">${I('play',30)}</button>

      <div class="pcta">
        <div style="min-width:0">
          <div class="pk">FROM THIS PROGRAMME</div>
          <div class="pt">${(COURSES.find(c=>c.educatorId===v.educatorId)||COURSES[0]).title}</div>
        </div>
        <button class="btn btn-accent" onclick="event.stopPropagation();go('course','${(COURSES.find(c=>c.educatorId===v.educatorId)||COURSES[0]).id}')">Join</button>
      </div>

      <div class="endcard" id="endcard">
        <div>
          <h3>Keep going.</h3>
          <p>You finished this lecture. Continue with the full programme — live classes, graded practice and tests.</p>
          <div class="row">
            <button class="btn btn-accent" onclick="event.stopPropagation();go('course','${(COURSES.find(c=>c.educatorId===v.educatorId)||COURSES[0]).id}')">${I('mortar',15)} See the programme</button>
            <button class="btn btn-ghost" style="background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.22)"
                    onclick="event.stopPropagation();replayVideo()">${I('replay',15)} Watch again</button>
          </div>
        </div>
      </div>

      <div class="pctrl" onclick="event.stopPropagation()">
        <div class="pbar" id="pbar" onclick="seek(event)">
          <span class="buf" style="width:${Math.min(100,(S.watch.t/v.secs)*100+18)}%"></span>
          <i id="pfill" style="width:${(S.watch.t/v.secs)*100}%"></i>
          ${v.chapters.map(c=>`<span class="chapmark" style="left:${(c[0]/v.secs)*100}%"></span>`).join('')}</div>
        <div class="prow">
          <button onclick="togglePlay()" id="ppbtn" aria-label="Play or pause">${I(S.watch.playing?'pause':'play',19)}</button>
          <button onclick="skip(-10);flashSeek('l','−10')" title="Back 10 seconds" aria-label="Back 10 seconds">${I('replay',18)}</button>
          <button onclick="skip(10);flashSeek('r','+10')" title="Forward 10 seconds" aria-label="Forward 10 seconds"
                  style="transform:scaleX(-1)">${I('replay',18)}</button>
          <button onclick="toggleMute()" id="volbtn" aria-label="Mute">${I(S.watch.muted?'mute':'vol',18)}</button>
          <span class="t"><span id="ptime">${fmt(Math.floor(S.watch.t))}</span> / ${v.duration}</span>
          <div class="sp">
            <button class="speed" onclick="cycleSpeed()" id="pspeed" aria-label="Playback speed">${S.watch.speed}×</button>
            <button onclick="toast('Captions on')" title="Captions" aria-label="Captions">${I('cc',18)}</button>
            <button onclick="toast('Quality · 1080p (auto)')" title="Quality" aria-label="Quality">${I('gear',18)}</button>
            <button onclick="toggleFS()" title="Fullscreen" aria-label="Fullscreen">${I('fullscreen',18)}</button></div>
        </div></div>
    </div>

    <h1 class="ital" style="font-size:27px;line-height:1.24;margin:18px 0 12px">${v.title}</h1>
    <div style="display:flex;align-items:center;gap:13px;flex-wrap:wrap">
      ${av(e,44)}
      <div style="cursor:pointer" onclick="go('educator','${e.id}')">
        <div style="font-weight:600;font-size:15px;display:flex;align-items:center;gap:5px">${e.name} ${vf(e)}</div>
        <div class="mono" style="font-size:11.5px;color:var(--ink-3)">${e.followers} followers</div></div>
      <button class="btn ${S.follows[e.id]?'btn-ghost':'btn-ink'}" onclick="toggleFollow('${e.id}')">
        ${S.follows[e.id]?I('check',15)+' Following':I('plus',15)+' Follow'}</button>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="toggleLike('${v.id}')">${I(S.likes[v.id]?'heartF':'heart',16)} ${S.likes[v.id]?'Liked':'Like'}</button>
        <button class="btn btn-ghost" onclick="toggleSave('${v.id}')">${I(S.saved[v.id]?'bookmarkF':'bookmark',16)} ${S.saved[v.id]?'Saved':'Save'}</button>
        <button class="btn btn-ghost" onclick="toast('Link copied')">${I('share',16)}</button></div>
    </div>

    <div class="card2" style="margin-top:16px;padding:16px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="mono" style="font-size:11.5px;color:var(--ink-2);font-weight:700">${v.views} views · ${v.ago} · ${v.tag}</span>
        <span class="drm" style="margin-left:auto">${I('shield',11)} Secure session</span></div>
      <div style="margin-top:9px;font-size:14px;line-height:1.6;color:var(--ink-2)">${v.desc}</div>
      <div class="divider" style="margin:14px 0"></div>
      <div class="mono" style="font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px">Chapters</div>
      ${v.chapters.map(c=>`<div onclick="jump(${c[0]})" style="display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer;font-size:13.5px">
        <span style="color:var(--accent-deep);display:flex">${I('play',13)}</span>
        <span class="mono" style="color:var(--accent-deep);font-weight:700;width:56px">${fmt(c[0])}</span><span>${c[1]}</span></div>`).join('')}
    </div>

    ${secH('Discussion',(cm.length+COMMENTS.length)+' comments')}
    <div style="display:flex;gap:12px;margin-bottom:8px">
      <div class="avatar" style="width:36px;height:36px;font-size:12px">RK</div>
      <input id="cmtInput" placeholder="Add a comment…" style="flex:1;padding:10px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);outline:none;font-size:13.5px"/>
      <button class="btn btn-ink" onclick="addComment('${v.id}')">${I('send',15)} Post</button></div>
    ${cm.map(c=>`<div class="cmt"><div class="avatar" style="width:36px;height:36px;font-size:12px">RK</div>
      <div><div style="font-weight:600;font-size:13px">You <span class="mono" style="font-weight:400;color:var(--ink-3);font-size:11px">· just now</span></div>
      <div style="font-size:13.5px;margin-top:3px">${c}</div></div></div>`).join('')}
    ${COMMENTS.map(c=>{const ce=ED(c.ed);return `<div class="cmt">${av(ce,36)}
      <div><div style="font-weight:600;font-size:13px;display:flex;align-items:center;gap:5px">${ce.name} ${vf(ce)}
        <span class="mono" style="font-weight:400;color:var(--ink-3);font-size:11px">· ${c.ago}</span></div>
      <div style="font-size:13.5px;margin-top:3px">${c.text}</div>
      <div style="display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--ink-3)">
        <span style="display:flex;align-items:center;gap:4px">${I('heart',13)} ${c.likes}</span><span style="cursor:pointer">Reply</span></div></div></div>`}).join('')}
   </div>

   <div>
    <div class="mono" style="font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px">Up next</div>
    ${VIDEOS.filter(x=>x.id!==v.id).slice(0,5).map(x=>{const xe=ED(x.educatorId);return `

let ptimer=null;
function togglePlay(){
  const v=VIDEOS.find(x=>x.id===S.param);if(!v)return;
  S.watch.playing=!S.watch.playing;
  const bp=document.getElementById('bigplay'),pb=document.getElementById('ppbtn'),pl=document.getElementById('player');
  if(pl)pl.classList.toggle('idle',!S.watch.playing);
  if(bp){bp.innerHTML=I(S.watch.playing?'pause':'play',30);bp.style.opacity=S.watch.playing?'0':'1';}
  if(pb)pb.innerHTML=I(S.watch.playing?'pause':'play',19);
  clearInterval(ptimer);
  if(S.watch.playing)ptimer=setInterval(()=>{S.watch.t+=S.watch.speed;
    if(S.watch.t>=v.secs){S.watch.t=v.secs;stopPlay();
      const ec=document.getElementById('endcard'); if(ec)ec.classList.add('on');
      const bp=document.getElementById('bigplay'); if(bp)bp.style.opacity='0';
      const pl=document.getElementById('player'); if(pl)pl.classList.remove('idle');}
    updateBar(v);moveWM();},250);
}
function stopPlay(){clearInterval(ptimer);S.watch.playing=false;
  const v=VIDEOS.find(x=>x.id===S.param);
  if(v&&S.watch.t>3){const pct=Math.round((S.watch.t/v.secs)*100);
    S.history=[{id:v.id,pct},...S.history.filter(h=>h.id!==v.id)].slice(0,6);}}
function updateBar(v){const f=document.getElementById('pfill'),t=document.getElementById('ptime');
  if(f)f.style.width=(S.watch.t/v.secs)*100+'%';if(t)t.textContent=fmt(Math.floor(S.watch.t));}
function moveWM(){const w=document.getElementById('wm');if(!w)return;
  const p=Math.floor(S.watch.t/12)%4;
  w.style.left=['6%','62%','58%','10%'][p];w.style.top=['12%','16%','76%','72%'][p];}
function seek(ev){const v=VIDEOS.find(x=>x.id===S.param);const r=ev.currentTarget.getBoundingClientRect();
  S.watch.t=Math.max(0,Math.min(v.secs,((ev.clientX-r.left)/r.width)*v.secs));updateBar(v);}
function skip(d){const v=VIDEOS.find(x=>x.id===S.param);S.watch.t=Math.max(0,Math.min(v.secs,S.watch.t+d));updateBar(v);}
function jump(t){const v=VIDEOS.find(x=>x.id===S.param);S.watch.t=t;updateBar(v);if(!S.watch.playing)togglePlay();}
function cycleSpeed(){const sp=[1,1.25,1.5,2,0.75];S.watch.speed=sp[(sp.indexOf(S.watch.speed)+1)%sp.length];
  document.getElementById('pspeed').textContent=S.watch.speed+'×';}
function toggleMute(){S.watch.muted=!S.watch.muted;document.getElementById('volbtn').innerHTML=I(S.watch.muted?'mute':'vol',18);}

/*═══════ TEST — runner ═══════*/
function startTest(id){
  const t=TESTS.find(x=>x.id===id), n=Math.min(t.qs,MCQ.length);
  S.test={id,n,cur:0,ans:{},mark:{},left:t.mins*60,started:Date.now(),done:false,rtab:0};
  go('runner',id);
  clearInterval(S.test.timer);
  S.test.timer=setInterval(()=>{
    if(!S.test||S.test.done)return clearInterval(S.test.timer);
    S.test.left--;
    const el=document.getElementById('tmr');
    if(el){el.textContent=fmt(S.test.left);el.parentElement.classList.toggle('warn',S.test.left<300);}
    if(S.test.left<=0){clearInterval(S.test.timer);submitTest(true);}
  },1000);
}
V.runner=()=>{
  const T=S.test; if(!T)return V.tests();
  if(T.done)return result();
  const t=TESTS.find(x=>x.id===T.id), q=MCQ[T.cur%MCQ.length];
  const st=i=>{const a=T.ans[i]!==undefined,m=T.mark[i];
    return (a&&m?'ansmark':m?'mark':a?'ans':T.seen&&T.seen[i]?'skip':'')+(i===T.cur?' cur':'');};
  return `<div class="exam protected">
    <div class="xtop">
      <span style="color:var(--accent);display:flex">${I('pencil',19)}</span>
      <span class="nm">${t.title}</span>
      <span class="drm">${I('lock',11)} SECURE</span>
      <div class="timer"><span style="display:flex">${I('clock',15)}</span><span id="tmr">${fmt(T.left)}</span></div>
      <button class="btn btn-ink btn-sm" onclick="submitTest(false)">Submit test</button>
    </div>
    <div class="xbody">
      <div class="xq">
        <div style="display:flex;align-items:center;max-width:760px;margin-bottom:16px">
          <span class="qnum">${I('list',13)} Question ${T.cur+1} of ${T.n}</span>
          <span class="qmarks"><span class="p">+4</span><span class="n">−1</span></span></div>
        <div style="max-width:760px">
          <div style="font-size:17.5px;line-height:1.62;font-weight:500;margin-bottom:22px">${q.q}</div>
          ${q.opts.map((o,i)=>`<div class="opt${T.ans[T.cur]===i?' picked':''}" onclick="pick(${i})">
            <span class="radio">${String.fromCharCode(65+i)}</span><span class="lb">${o}</span></div>`).join('')}
          <div class="mono" style="font-size:11px;color:var(--ink-3);margin-top:18px;display:flex;align-items:center;gap:7px">
            ${I('layers',13)} Topic · ${q.topic}</div>
        </div>
      </div>
      <div class="xside">
        <div style="padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px">
          <div class="avatar" style="width:32px;height:32px;font-size:11px">RK</div>
          <div><div style="font-size:13px;font-weight:600">${ME.name}</div>
            <div class="mono" style="font-size:10.5px;color:var(--ink-3)">${Object.keys(T.ans).length} of ${T.n} answered</div></div></div>
        <div class="pal">${Array.from({length:T.n},(_,i)=>`<button class="pnum ${st(i)}" onclick="jumpQ(${i})">${i+1}</button>`).join('')}</div>
        <div class="legend">
          <div><i style="background:var(--positive)"></i> Answered</div>
          <div><i style="background:var(--violet)"></i> Marked</div>
          <div><i style="background:rgba(224,58,58,.35)"></i> Skipped</div>
          <div><i style="background:var(--surface-3);border:1px solid var(--line-2)"></i> Not visited</div></div>
      </div>
    </div>
    <div class="xfoot">
      <button class="btn btn-ghost" onclick="markQ()">${I(T.mark[T.cur]?'bookmarkF':'bookmark',15)} ${T.mark[T.cur]?'Unmark':'Mark for review'}</button>
      <button class="btn btn-ghost" onclick="clearQ()">${I('refresh',15)} Clear response</button>
      <div style="flex:1"></div>
      <button class="btn btn-ghost" onclick="navQ(-1)" ${T.cur===0?'disabled':''}>${I('back',15)} Previous</button>
      <button class="btn btn-accent" onclick="navQ(1)">${T.cur===T.n-1?'Go to last':'Save &amp; next'} ${I('arrow',15)}</button>
    </div>
  </div>`;
};
function pick(i){S.test.ans[S.test.cur]=i;render();}
function markQ(){S.test.mark[S.test.cur]=!S.test.mark[S.test.cur];render();}
function clearQ(){delete S.test.ans[S.test.cur];render();}
function navQ(d){const T=S.test;T.seen=T.seen||{};T.seen[T.cur]=true;
  T.cur=Math.max(0,Math.min(T.n-1,T.cur+d));render();}
function jumpQ(i){const T=S.test;T.seen=T.seen||{};T.seen[T.cur]=true;T.cur=i;render();}
function submitTest(auto){
  const T=S.test; if(!auto&&!confirm('Submit the test now? You cannot change answers after this.'))return;
  clearInterval(T.timer);T.done=true;T.rtab=0;
  const t=TESTS.find(x=>x.id===T.id);T.spent=t.mins*60-T.left;
  render();toast(auto?'Time up — test submitted':'Test submitted');
}
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function rtab(i){S.test.rtab=i;render();}

/*═══════ TEST — result ═══════*/
function score(){const T=S.test;let c=0,w=0;
  for(let i=0;i<T.n;i++){const a=T.ans[i];if(a===undefined)continue;
    (a===MCQ[i%MCQ.length].correct)?c++:w++;}
  return {c,w,u:T.n-c-w,marks:c*4-w,max:T.n*4,acc:c+w?Math.round(c/(c+w)*100):0};
}
function result(){
  const T=S.test,t=TESTS.find(x=>x.id===T.id),s=score();
  const tabs=[['Result','award'],['Solutions','book'],['Leaderboard','crown'],['Analysis','trend']];
  const beat=Math.max(1,Math.min(99,Math.round(s.acc*0.94)));
  return `<button class="back" onclick="go('tests')">${I('back',16)} All test series</button>
  <div class="card2" style="padding:26px;display:flex;gap:30px;align-items:center;flex-wrap:wrap">
    <div class="ring" style="--p:${Math.max(0,(s.marks/s.max)*100)}"><div>
      <div class="ital" style="font-size:27px;line-height:1">${s.marks}</div>
      <div class="mono" style="font-size:9px;letter-spacing:1px;color:var(--ink-3)">OF ${s.max}</div></div></div>
    <div style="flex:1;min-width:250px">
      <div class="mono" style="font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent-deep)">Test submitted</div>
      <h1 class="ital" style="font-size:27px;line-height:1.25;margin:6px 0 8px">${t.title}</h1>
      <div style="font-size:13.5px;color:var(--ink-2)">You scored better than <b>${beat}%</b> of ${t.attempted} students.</div>
    </div>
    <div style="display:flex;gap:22px;flex-wrap:wrap">
      ${[[s.c,'Correct','var(--positive)'],[s.w,'Wrong','#C63030'],[s.u,'Skipped','var(--ink-3)'],
         [s.acc+'%','Accuracy','var(--accent-deep)'],[mmss(T.spent||0),'Time','var(--info)']]
        .map(([v,l,c])=>`<div><div class="ital" style="font-size:26px;color:${c}">${v}</div>
          <div class="mono" style="font-size:8.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-3)">${l}</div></div>`).join('')}
    </div>
  </div>
  <div class="tabs" style="margin-top:22px">

  </div>
  ${[resSummary(s,t),resSolutions(),resBoard(s),resAnalysis(s)][T.rtab]}`;
}
const resSummary=(s,t)=>{
  const T=S.test;
  return `<div class="grid g-2">
    <div class="card2"><div class="chead"><h3>Question breakdown</h3><span class="m">${T.n} questions</span></div>
      <div class="cbody">
        <div style="display:flex;height:13px;border-radius:7px;overflow:hidden;background:var(--surface-3);margin-bottom:16px">
          <i style="width:${s.c/T.n*100}%;background:var(--positive)"></i>
          <i style="width:${s.w/T.n*100}%;background:#C63030"></i></div>
        ${[['Correct',s.c,'var(--positive)','+'+s.c*4],['Wrong',s.w,'#C63030','−'+s.w],['Unattempted',s.u,'var(--ink-3)','0']]
          .map(([l,n,c,m])=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">
            <i style="width:11px;height:11px;border-radius:4px;background:${c}"></i>

            <span class="mono" style="font-weight:700">${n}</span>
            <span class="mono" style="font-size:11.5px;color:var(--ink-3);width:40px;text-align:right">${m}</span></div>`).join('')}
      </div></div>
    <div class="card2"><div class="chead"><h3>How you compare</h3><span class="m">${t.attempted} attempts</span></div>
      <div class="cbody">
        ${(()=>{const k=s.max/(t.qs*4),avg=Math.round(t.avg*4*k),top=Math.round(t.top*4*k);
          return [['Your score',s.marks,'var(--accent)'],['Average score',avg,'var(--ink-3)'],['Topper score',top,'var(--violet)']]
          .map(([l,v,c])=>`<div style="margin-bottom:16px">
            <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px">
              <span>${l}</span><span class="mono" style="font-weight:700">${v} <span style="color:var(--ink-3);font-weight:400">/ ${s.max}</span></span></div>
            <div style="height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden">
              <i style="display:block;height:100%;width:${Math.max(2,Math.min(100,v/s.max*100))}%;background:${c};border-radius:5px"></i></div>
          </div>`).join('')})()}
        <div class="divider"></div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-accent btn-sm" style="flex:1;justify-content:center" onclick="rtab(1)">${I('book',14)} View solutions</button>

      </div></div>
  </div>`;
};
const resSolutions=()=>{
  const T=S.test;
  return Array.from({length:T.n},(_,i)=>{
    const q=MCQ[i%MCQ.length],a=T.ans[i],ok=a===q.correct;
    return `<div class="card2" style="padding:20px;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
        <span class="qnum">Q${i+1}</span>
        <span class="tag ${a===undefined?'':ok?'ok':'live'}">${a===undefined?'Skipped':ok?I('check',10)+' Correct':'Incorrect'}</span>
        <span class="tag">${I('layers',10)} ${q.topic}</span>
        <span class="mono" style="margin-left:auto;font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px">
          ${I('clock',12)} avg ${q.secs}s</span></div>
      <div style="font-size:15.5px;line-height:1.6;font-weight:500;margin-bottom:16px">${q.q}</div>
      ${q.opts.map((o,j)=>`<div class="opt ${j===q.correct?'right':j===a&&!ok?'wrong':''}" style="cursor:default">
        <span class="radio">${String.fromCharCode(65+j)}</span><span class="lb">${o}</span>
        ${j===q.correct?`<span class="pc" style="color:var(--positive);display:flex">${I('check',16)}</span>`:
          j===a?`<span class="pc" style="color:#C63030;display:flex">${I('close',16)}</span>`:''}</div>`).join('')}
      <div style="margin-top:14px;padding:14px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0">
        <div class="mono" style="font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent-deep);margin-bottom:6px">Solution</div>
        <div style="font-size:13.5px;line-height:1.65;color:var(--ink-2)">${q.ex}</div></div>
    </div>`;}).join('');
};
const resBoard=s=>{
  const T=S.test;
  const rows=[...LEADERBOARD.map(([n,sc,tm,ct])=>({n,sc,tm,ct,me:false})),
              {n:ME.name+' (you)',sc:s.marks,tm:mmss(T.spent||0),ct:'Delhi',me:true}]
    .sort((a,b)=>b.sc-a.sc||a.tm.localeCompare(b.tm));
  const myRank=rows.findIndex(r=>r.me)+1;
  return `<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
    ${rows.slice(0,3).map((r,i)=>`<div class="card2" style="padding:20px;text-align:center;${i===0?'border-color:var(--accent-line);background:var(--accent-soft)':''}">
      <div style="color:${['var(--accent)','var(--ink-3)','#B5763A'][i]};display:flex;justify-content:center">${I(i===0?'crown':'award',26)}</div>
      <div style="font-weight:600;font-size:14.5px;margin-top:9px">${r.n}</div>
      <div class="mono" style="font-size:11px;color:var(--ink-3)">${r.ct}</div>
      <div class="ital" style="font-size:26px;margin-top:7px">${r.sc}</div>
      <div class="mono" style="font-size:10.5px;color:var(--ink-3)">${r.tm} taken</div></div>`).join('')}
  </div>
  <div class="card2"><div class="chead"><h3>Leaderboard</h3><span class="m">You are rank #${myRank} of ${rows.length}</span></div>
  <div class="tblw"><table class="tbl">
    <thead><tr><th style="width:60px">Rank</th><th>Student</th><th>City</th><th class="r">Score</th><th class="r">Time</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr class="${r.me?'me':''}">
      <td class="mono">${i<3?['🥇','🥈','🥉'][i]:'#'+(i+1)}</td>
      <td style="font-weight:600">${r.n}</td><td style="color:var(--ink-3)">${r.ct}</td>
      <td class="r mono">${r.sc}</td><td class="r mono" style="color:var(--ink-3)">${r.tm}</td></tr>`).join('')}
    </tbody></table></div></div>`;
};
const resAnalysis=s=>{
  const T=S.test,tp={};
  for(let i=0;i<T.n;i++){const q=MCQ[i%MCQ.length],a=T.ans[i];
    tp[q.topic]=tp[q.topic]||{t:0,c:0,w:0,u:0};tp[q.topic].t++;
    a===undefined?tp[q.topic].u++:(a===q.correct?tp[q.topic].c++:tp[q.topic].w++);}
  const arr=Object.entries(tp).map(([k,v])=>[k,v,Math.round(v.c/v.t*100)]).sort((a,b)=>b[2]-a[2]);
  const weak=arr.filter(x=>x[2]<60);
  return `<div class="grid g-2">
    <div class="card2"><div class="chead"><h3>Topic-wise accuracy</h3><span class="m">${arr.length} topics</span></div>
      <div class="cbody">${arr.map(([k,v,p])=>`<div style="margin-bottom:15px">
        <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px">
          <span style="font-weight:600">${k}</span>
          <span class="mono" style="font-weight:700;color:${p>=80?'var(--positive)':p>=50?'var(--accent-deep)':'#C63030'}">${p}%</span></div>
        <div style="height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden">
          <i style="display:block;height:100%;width:${p}%;border-radius:5px;background:${p>=80?'var(--positive)':p>=50?'var(--accent)':'#C63030'}"></i></div>
        <div class="mono" style="font-size:10.5px;color:var(--ink-3);margin-top:4px">${v.c} correct · ${v.w} wrong · ${v.u} skipped</div>
      </div>`).join('')}</div></div>
    <div>
      <div class="card2"><div class="chead"><h3>Time management</h3><span class="m">vs topper pace</span></div>
        <div class="cbody">
          ${[['Your total time',mmss(T.spent||0)],['Topper time',LEADERBOARD[0][2]],['Avg time per question',mmss(Math.round((T.spent||0)/T.n))],
             ['Questions attempted',(s.c+s.w)+' of '+T.n]].map(([l,v])=>`
            <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px">
              <span style="color:var(--ink-2)">${l}</span><span class="mono" style="font-weight:700">${v}</span></div>`).join('')}
        </div></div>
      <div class="card2" style="margin-top:13px"><div class="chead"><h3>What to fix next</h3><span class="m">Personalised</span></div>
        <div class="cbody">
          ${(weak.length?weak:arr.slice(-2)).map(([k])=>`
            <div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)">
              <span style="color:var(--accent-deep);display:flex">${I('target',17)}</span>
              <div style="flex:1"><div style="font-weight:600;font-size:13.5px">${k}</div>
                <div style="font-size:12px;color:var(--ink-3)">Revise this topic, then reattempt</div></div>
              <button class="btn btn-ghost btn-sm" onclick="go('watch','v1')">${I('play',13)} Watch</button></div>`).join('')}
          <button class="btn btn-accent" style="width:100%;justify-content:center;margin-top:14px" onclick="go('courses')">
            ${I('mortar',15)} Find a course for these topics</button>
        </div></div>
    </div>
  </div>`;
};

/*═══════ PDF — Drive-style viewer ═══════*/
V.pdf=()=>{
  const p=PDFS.find(x=>x.id===S.param); if(!p)return V.pdfs();
  const e=ED(p.educatorId), n=PDF_PAGES.length, cur=Math.min(S.pdfPage,n-1), z=S.pdfZoom/100;
  const pg=PDF_PAGES[cur];
  return `<div class="drive protected">
    <div class="dtop">
      <button class="dbtn" onclick="go('pdfs')" title="Close">${I('back',18)}</button>
      <span style="color:#E0A95C;display:flex">${I('doc',19)}</span>
      <span class="fn">${p.title}</span>
      <span class="ppill" style="margin-left:4px">${I('lock',11)} VIEW ONLY</span>
      <div style="flex:1"></div>
      <div class="dpg">
        <button class="dbtn" onclick="pdfNav(-1)" ${cur===0?'disabled style="opacity:.3"':''}>${I('up',17)}</button>
        <input value="${cur+1}" onchange="pdfGo(this.value)"/>
        <span style="opacity:.6">/ ${n}</span>
        <button class="dbtn" onclick="pdfNav(1)" ${cur===n-1?'disabled style="opacity:.3"':''}>${I('down',17)}</button></div>
      <div class="dsep"></div>
      <button class="dbtn" onclick="pdfZoom(-10)" title="Zoom out">${I('zoomOut',18)}</button>
      <span class="mono" style="font-size:12px;width:44px;text-align:center">${S.pdfZoom}%</span>
      <button class="dbtn" onclick="pdfZoom(10)" title="Zoom in">${I('zoomIn',18)}</button>
      <button class="dbtn" onclick="pdfFit()" title="Fit to page">${I('fullscreen',18)}</button>
      <div class="dsep"></div>
      <button class="dbtn" onclick="toast('${p.price==='Free'?'Download started — watermarked copy':'Buy this note to download'}')" title="Download">${I('download',18)}</button>
      <button class="dbtn" onclick="toast('Printing is disabled for protected notes')" title="Print">${I('print',18)}</button>
      <button class="dbtn" onclick="toast('Link copied')" title="Share">${I('share',18)}</button>
      <button class="dbtn" onclick="toggleSave('${p.id}')" title="Save">${I(S.saved[p.id]?'bookmarkF':'bookmark',18)}</button>
    </div>
    <div class="dmain">
      <div class="drail">
        ${PDF_PAGES.map((x,i)=>`<div class="thmb${i===cur?' on':''}" onclick="pdfGo(${i+1})">
          <div class="mini"><b style="font-size:6px">${x.h}</b><br/><br/>${x.b.slice(0,240)}…</div>
          <div class="lbl">${i+1}</div></div>`).join('')}
        ${p.pages>n?`<div style="text-align:center;font-family:var(--mono);font-size:10px;opacity:.5;padding:6px">
          + ${p.pages-n} more pages</div>`:''}
      </div>
      <div class="dview">
        <div class="sheet" style="transform:scale(${z})">
          <div class="pwm">${ME.handle}</div>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:26px">
            <div style="width:26px;height:26px;border-radius:7px;background:#F0561D"></div>
            <div><div style="font-family:var(--mono);font-size:9px;letter-spacing:1.6px;color:#C63E0C;font-weight:700">CHEMPSI · ${e.name.toUpperCase()}</div>
              <div style="font-size:10.5px;color:#9A9186">${p.title}</div></div></div>
          <h2>${pg.h}</h2>
          <p>${pg.b}</p>
          <div class="hint"><b style="color:#C63E0C">Hint · </b>${pg.hint}</div>
          <div class="pfoot"><span>CHEMPSI · ${e.handle}</span>
            <span>LICENSED TO ${ME.handle.toUpperCase()} · PAGE ${cur+1} OF ${p.pages}</span></div>
        </div>
        <div style="font-family:var(--mono);font-size:10.5px;opacity:.45;letter-spacing:1px;padding-bottom:20px">
          ${cur+1} of ${n} preview pages · ${p.size} · ${p.downloads} downloads</div>
      </div>
    </div>
  </div>`;
};
function pdfNav(d){const n=PDF_PAGES.length;S.pdfPage=Math.max(0,Math.min(n-1,S.pdfPage+d));render();}
function pdfGo(v){const n=PDF_PAGES.length,i=parseInt(v)-1;
  S.pdfPage=isNaN(i)?S.pdfPage:Math.max(0,Math.min(n-1,i));render();}
function pdfZoom(d){S.pdfZoom=Math.max(50,Math.min(200,S.pdfZoom+d));render();}
function pdfFit(){S.pdfZoom=100;render();}

/*═══════ BOOT ═══════*/
document.addEventListener('keydown',e=>{
  if(S.view==='pdf'){if(e.key==='ArrowDown'||e.key==='ArrowRight')pdfNav(1);
    if(e.key==='ArrowUp'||e.key==='ArrowLeft')pdfNav(-1);if(e.key==='Escape')go('pdfs');}
  if(S.view==='runner'&&S.test&&!S.test.done){
    if(e.key==='ArrowRight')navQ(1);if(e.key==='ArrowLeft')navQ(-1);
    if(['1','2','3','4'].includes(e.key))pick(+e.key-1);}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(!h)return;
  const [v,p]=h.split('/');if(v!==S.view||p!==S.param){S.view=v;S.param=p||null;S.tab=0;render();}});
function boot(){const h=location.hash.slice(1);
  if(h){const [v,p]=h.split('/');
    if(v==='runner'&&TESTS.some(t=>t.id===p))return startTest(p);
    if(V[v]){S.view=v;S.param=p||null;}}
  render();}

</script>
<script>
/*═══════════════════════════════════════════════
  ChemPsi — app shell behaviour
  bottom tabs · install · live-hero lab · player
═══════════════════════════════════════════════*/

/*── bottom tab bar ──*/
const TABBAR=[['home','home','Home'],['courses','mortar','Courses'],['tests','pencil','Tests'],
 ['pdfs','doc','Notes'],['profile','user','You']];
function tabbar(){
  const cur=S.view, map={course:'courses',watch:'home',educator:'home',test:'tests',runner:'tests',
    pdf:'pdfs',explore:'home',live:'home',livewatch:'home',library:'profile',saved:'profile',
    community:'home',post:'home',search:'home',contact:'profile'};
  const active=map[cur]||cur;
  const el=document.getElementById('tabbar'); if(!el)return;
  el.innerHTML=TABBAR.map(([v,ic,t])=>`<button class="${active===v?'on':''}" onclick="go('${v}')" aria-label="${t}">
    <span class="tbi">${I(ic,21)}</span>${t}</button>`).join('');
}

/*── add to home screen ──*/
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstall();});
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function showInstall(){
  if(isStandalone())return;
  try{if(localStorage.getItem('cp_install_hidden')==='1')return;}catch(e){}
  const b=document.getElementById('installbar'); if(!b)return;
  b.classList.add('show');
}
function hideInstall(){const b=document.getElementById('installbar');if(b)b.classList.remove('show');
  try{localStorage.setItem('cp_install_hidden','1')}catch(e){}}
async function doInstall(){
  if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;
    deferredPrompt=null;hideInstall();toast(r.outcome==='accepted'?'Installing ChemPsi…':'You can install any time');return;}
  document.getElementById('iossheet').classList.add('on');
}
function closeSheet(){document.getElementById('iossheet').classList.remove('on');}

function labArt(){
  const bubbles=Array.from({length:9},(_,i)=>{
    const size=4+Math.random()*7, left=Math.random()*46, dur=(2.6+Math.random()*2.4).toFixed(2), del=(Math.random()*3).toFixed(2);
    return `<i class="bub" style="width:${size}px;height:${size}px;right:${58+left}px;animation-duration:${dur}s;animation-delay:${del}s"></i>`;
  }).join('');
  const mols=[[18,58,9,'rgba(255,255,255,.30)'],[42,22,7,'rgba(255,201,172,.36)'],[66,72,6,'rgba(111,219,236,.34)'],[80,40,8,'rgba(255,255,255,.22)']]
    .map(([l,t,r,c],i)=>`<svg class="mol" style="left:${l}%;top:${t}%;width:${r*6}px;height:${r*6}px;animation-duration:${10+i*4}s"
      viewBox="0 0 60 60" fill="none" stroke="${c}" stroke-width="1.4">
      <circle cx="30" cy="12" r="5"/><circle cx="14" cy="40" r="5"/><circle cx="46" cy="40" r="5"/>
      <path d="M30 17 16 35M30 17l14 18M19 40h22"/></svg>`).join('');
  return `<div class="lh-lab" aria-hidden="true">
    <div class="beam"></div>
    <svg class="orbit" viewBox="0 0 200 200" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1.2">
      <ellipse cx="100" cy="100" rx="86" ry="32"/><ellipse cx="100" cy="100" rx="86" ry="32" transform="rotate(60 100 100)"/>
      <ellipse cx="100" cy="100" rx="86" ry="32" transform="rotate(120 100 100)"/>
      <circle cx="100" cy="100" r="6" fill="rgba(255,107,51,.55)" stroke="none"/></svg>
    ${mols}
    <svg class="flask" viewBox="0 0 120 140" fill="none">
      <path d="M48 14h24M54 14v32L26 112a12 12 0 0 0 10 18h48a12 12 0 0 0 10-18L66 46V14"
            stroke="rgba(255,255,255,.34)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M34 100h52l8 14a10 10 0 0 1-9 16H35a10 10 0 0 1-9-16z" fill="rgba(240,86,29,.34)"/>
      <path d="M34 100h52" stroke="rgba(255,255,255,.28)" stroke-width="1.4"/>
    </svg>
    ${bubbles}
  </div>`;
}

/*── player: keyboard, gestures, fullscreen, CTA ──*/
function playerKeys(e){
  if(S.view!=='watch'||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
  const k=e.key;
  if(k===' '||k==='k'){e.preventDefault();togglePlay();}
  else if(k==='ArrowRight'){e.preventDefault();skip(10);flashSeek('r','+10');}
  else if(k==='ArrowLeft'){e.preventDefault();skip(-10);flashSeek('l','−10');}
  else if(k==='m'){toggleMute();}
  else if(k==='f'){toggleFS();}
  else if(k==='Escape'){const p=document.getElementById('player');if(p&&p.classList.contains('fs'))toggleFS();}
}
document.addEventListener('keydown',playerKeys);
function flashSeek(side,label){
  const f=document.getElementById('sf-'+side); if(!f)return;
  f.textContent=label; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}
function dblSeek(side){
  if(side==='r'){skip(10);flashSeek('r','+10 s');}else{skip(-10);flashSeek('l','−10 s');}
}
function toggleFS(){
  const p=document.getElementById('player'); if(!p)return;
  p.classList.toggle('fs');
  const on=p.classList.contains('fs');
  document.body.style.overflow=on?'hidden':'';
  if(on&&p.requestFullscreen)p.requestFullscreen().catch(()=>{});
  else if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement)exitFS();
});
function exitFS(){
  const p=document.getElementById('player');
  if(p)p.classList.remove('fs');
  document.body.style.overflow='';
}
function touchReveal(){
  const p=document.getElementById('player'); if(!p)return;
  p.classList.add('touched'); clearTimeout(p._t);
  p._t=setTimeout(()=>p.classList.remove('touched'),3200);
}
function replayVideo(){const e=document.getElementById('endcard');if(e)e.classList.remove('on');
  S.watch.t=0;updateBar(VIDEOS.find(v=>v.id===S.param));togglePlay();}

/*── boot the shell ──*/
function mountShell(){
  if(!document.getElementById('tabbar')){
    document.body.insertAdjacentHTML('beforeend','<nav class="tabbar" id="tabbar"></nav>');
    document.body.insertAdjacentHTML('beforeend',iosSheet());
  }
  tabbar();
  if(isIOS()&&!isStandalone())showInstall();
}
const _renderShell=render;
render=function(){
  _renderShell();
  if(!document.querySelector('.player.fs')&&!document.querySelector('.exam')&&!document.querySelector('.drive'))
    document.body.style.overflow='';   // never leave the page locked
  const m=document.getElementById('main');
  if(m&&['home','courses','profile'].includes(S.view)&&!isStandalone()){
    m.insertAdjacentHTML('afterbegin',installBar());
    if(deferredPrompt||isIOS())showInstall();
  }
  tabbar();
};
/*── offline + installable when hosted over http(s) ──*/
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
mountShell();boot();

</script>
