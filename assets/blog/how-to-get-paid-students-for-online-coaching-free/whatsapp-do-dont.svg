ight', Arial, sans-serif" font-size="25" font-weight="500" fill="#14161F" text-anchor="start" letter-spacing="0" opacity="1">Real dates, real seats</text><text x="656" y="790" font-family="Inter, 'Inter Tight', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6070" text-anchor="start" letter-spacing="0" opacity="1">Summary of the WhatsApp Business</text><text x="656" y="816" font-family="Inter, 'Inter Tight', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6070" text-anchor="start" letter-spacing="0" opacity="1">Messaging Policy, checked Nov 2026</text><text x="656" y="842" font-family="Inter, 'Inter Tight', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6070" text-anchor="start" letter-spacing="0" opacity="1">Logos belong to their owners.</text></svg>
