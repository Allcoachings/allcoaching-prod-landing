    same_as:
      - https://en.wikipedia.org/wiki/National_Eligibility_cum_Entrance_Test

  exam-jee:
    name: Joint Entrance Examination
    type: Course
    same_as:
      - https://en.wikipedia.org/wiki/Joint_Entrance_Examination

  exam-upsc:
    name: Union Public Service Commission Civil Services Examination
