  .cl .pf > div{flex:1 1 150px}
  .cl .pf .btn{flex:1 1 100%}
  .cl .kv{grid-template-columns:96px minmax(0,1fr) auto}
  .cl .cont{grid-template-columns:96px minmax(0,1fr);gap:14px}
}

/* v2.88 — additions for the live renderer (not in the design file). */
.cl img.mark{object-fit:cover;background:transparent}
.cl .pop button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border-radius:9px;font-weight:500;font-size:14.5px;color:var(--ink2);text-align:left}
.cl .pop button:hover{background:var(--soft);color:var(--ink)}

/* v2.88 — the pages that still render their own (pre-Classic) view inside
   the new shell (course detail, live, community, profile, library, saved)
   take Classic's one typeface: no serif display, no mono labels, no italics. */
.cl .cl-route{--display:var(--font-ui),'Inter Tight',system-ui,sans-serif;--mono:var(--font-ui),'Inter Tight',system-ui,sans-serif}
.cl .cl-route :is(.ital,.sec h2,.ccard .pn,.empty h4,.stat .v,.livehero h3){font-style:normal;letter-spacing:-.02em}

/* v2.90 — on a phone or tablet the banner is the desktop banner, smaller:
   the same shape, the words on the left over the art's empty side, nothing
   cropped. The words scale with the banner's width (cqw), with floors so
   they stay readable; a phone image keeps its own shape. Last in the file
   so it settles the earlier small-screen rules. */
.cl .hero .slide{container-type:inline-size}
/* The slide's button row shares the class `cta` with the Call-to-action
   section, whose 48px padding pushed the button in from the words. */
.cl .hero .over .cta{padding:0;text-align:left}
@media (max-width:1000px){
  .cl .hero .slide .art{aspect-ratio:1120/400}
  .cl .hero .slide.pimg .art{aspect-ratio:auto}
  .cl .hero .slide.pimg .art img{height:auto}
  .cl .hero .over{position:absolute;inset:0;justify-content:center;max-width:58%;background:none;gap:6px;gap:clamp(4px,1.1cqw,14px);padding:0 0 0 16px;padding:0 0 0 clamp(14px,4.6cqw,56px)}
  .cl .hero .over h1{font-size:18px;font-size:clamp(14px,3.6cqw,42px);color:#1A1B22!important}
  .cl .hero .over p{font-size:12px;font-size:clamp(10px,1.5cqw,17px);color:#4A4F5E!important}
  .cl .hero .over .cta{margin-top:2px;margin-top:clamp(2px,.6cqw,6px)}
  .cl .hero .over .btn{height:30px;height:clamp(26px,3.8cqw,44px);padding:0 12px;padding:0 clamp(10px,2cqw,20px);font-size:12px;font-size:clamp(11px,1.35cqw,15px)}
}
/* Phones: the words on the picture, the button under it. The slide keeps a
   row for the button below the art; the dots sit at that row's right. */
@media (max-width:600px){
  .cl .hero .slide .art{aspect-ratio:16/9}
  .cl .hero .slide.pimg .art{aspect-ratio:auto}
  .cl .hero .slide.img .art{aspect-ratio:1120/400}
  .cl .hero .slide.has-b{padding-bottom:64px}
  .cl .hero .over{inset:0;max-width:none;justify-content:flex-end;gap:6px;padding:0 16px 14px;background:linear-gradient(to top,rgba(255,255,255,.9),rgba(255,255,255,.6) 45%,transparent 78%)}
  .cl .hero .slide.has-b .over{bottom:64px}
  .cl .hero .over h1{font-size:21px}
  .cl .hero .over p{font-size:13.5px}
  .cl .hero .over .cta{position:absolute;left:16px;top:100%;margin-top:12px}
  .cl .hero .over .btn{height:40px;padding:0 18px;font-size:14px;background:var(--primary);color:var(--primary-ink)}
  .cl .hero .dots{left:auto;right:16px;bottom:28px}
}
/* Sample content in a section with nothing of its own: nothing in it can be
   clicked (the editor still selects the section underneath). */
.cl .cl-sample a,.cl .cl-sample button,.cl .cl-sample summary,.cl .cl-sample [data-ac^="block:"]{pointer-events:none}
/* One form on its own, at a width a form reads at. */
.cl .forms.one{grid-template-columns:minmax(0,1fr);max-width:720px}

/* Course collections with "Show images" off: name and count only */
.cl .ct.noimg{display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:84px;padding:18px 16px}
.cl .ct.noimg b,.cl .ct.noimg span{padding:0}
